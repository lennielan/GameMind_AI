appId: com.gamemind.ai
productName: GameMind AI
directories:
  buildResources: build
publish:
  provider: github
  owner: lennielan
  repo: GameMind_AI
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - '**/*.node'
win:
  executableName: gamemind-ai
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  runAfterFinish: true
linux:
  executableName: gamemind-ai
  icon: build/icon.png
  category: Utility
  synopsis: AI-powered gaming analytics platform for Steam
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
deb:
  artifactName: ${name}-${version}-amd64.${ext}
  maintainer: GameMind AI <contact@gamemind.ai>
  depends:
    - libnotify4
    - libxtst6
    - libnss3
appImage:
  artifactName: ${name}-${version}.${ext}

