<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GameMind AI — AI-powered gaming analytics platform for Steam" />
    <title>GameMind AI</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: file: https://avatars.steamstatic.com https://avatars.akamai.steamstatic.com https://cdn.akamai.steamstatic.com https://steamcdn-a.akamaihd.net https://media.steampowered.com; connect-src 'self' ws://localhost:* wss://*.supabase.co http://localhost:* https://*.supabase.co https://api.groq.com https://generativelanguage.googleapis.com https://api.openai.com https://api.anthropic.com https://openrouter.ai https://1.1.1.1">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('gamemind_theme') || 'dark';
          var accent = localStorage.getItem('gamemind_accent') || 'violet';
          var resolvedTheme = theme === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : theme;
          document.documentElement.setAttribute('data-theme', resolvedTheme);
          document.documentElement.setAttribute('data-accent', accent);
        } catch (e) {}
      })();
    </script>
    <style>
      .initial-loader {
        position: fixed;
        inset: 0;
        background: var(--bg-app, #0a0a0f);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--accent-subtle, rgba(124, 92, 252, 0.2));
        border-radius: 50%;
        border-top-color: var(--accent-primary, #7c5cfc);
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
